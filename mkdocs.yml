markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - hooks/copy_media.py

plugins:
  - search:
      lang: es
  - minify:
      minify_html: true
  - social:
      enabled: !ENV [CI, true]
      cards: true
      cards_color:
        fill: '#0a0a0f'
        text: '#e63946'
      enabled: true

use_directory_urls: true

