{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta %}
    {% if page.meta.description %}
      <meta name="description" content="{{ page.meta.description }}">
      <meta property="og:description" content="{{ page.meta.description }}">
    {% endif %}
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    {% if page.meta.description %}
      <meta name="twitter:description" content="{{ page.meta.description }}">
    {% endif %}
    {% if page.meta.date %}
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": {{ page.title|tojson }},
        "datePublished": {{ (page.meta.date|string)|tojson }},
        "dateModified": {{ (page.meta.date|string)|tojson }},
        "author": {"@type": "Organization", "name": "Somos El Encuadre"},
        "publisher": {
          "@type": "Organization",
          "name": "Somos El Encuadre",
          "url": "https://elencuadre.pages.dev"
        },
        "mainEntityOfPage": {"@type": "WebPage", "@id": {{ page.canonical_url|tojson }}},
        {% if page.meta.description %}"description": {{ page.meta.description|tojson }},{% endif %}
        "inLanguage": "es-ES"
      }
      </script>
    {% endif %}
  {% endif %}
{% endblock %}
