  <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "SoftwareApplication", "name": "HTTP Status Codes", "description": "Searchable list of HTTP status codes with plain meanings and when to use each.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (browser)", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "EUR"}}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "¿Qué significa el código 404 y cuándo debería usarlo?", "acceptedAnswer": {"@type": "Answer", "text": "El código 404 Not Found indica que el servidor no ha encontrado el recurso solicitado. Se utiliza cuando la URL es incorrecta o el contenido ha sido eliminado. Es útil para informar al usuario que la página no existe y, a menudo, se combina con una página de error personalizada que sugiere alternativas o un buscador interno."}}, {"@type": "Question", "name": "¿Cuál es la diferencia entre 301 y 302?", "acceptedAnswer": {"@type": "Answer", "text": "El 301 Moved Permanently indica que la URL ha cambiado de forma definitiva, por lo que los motores de búsqueda actualizan sus índices y los navegadores almacenan la nueva dirección. En cambio, el 302 Found señala un cambio temporal; los clientes siguen usando la URL original en futuras peticiones. Elegir el código correcto ayuda a mantener el SEO y la experiencia del usuario."}}, {"@type": "Question", "name": "¿Cuándo es apropiado devolver un 204 No Content?", "acceptedAnswer": {"@type": "Answer", "text": "Un 204 No Content se devuelve cuando la solicitud se procesa con éxito pero no hay cuerpo que enviar de vuelta, como en respuestas a operaciones DELETE o PUT que no requieren confirmación adicional. El cliente recibe la cabecera de éxito y puede actualizar su estado sin descargar datos innecesarios, lo que ahorra ancho de banda."}}, {"@type": "Question", "name": "¿Cómo usar el código 100 Continue para optimizar la transferencia de datos?", "acceptedAnswer": {"@type": "Answer", "text": "Al iniciar una petición con cuerpo, el cliente envía los encabezados y espera el código 100 Continue antes de transmitir el contenido. Si el servidor detecta problemas en los encabezados (por ejemplo, autenticación fallida), responde con un error y evita que el cliente envíe datos pesados. Esto reduce tráfico y acelera la detección de errores."}}, {"@type": "Question", "name": "¿Qué debo hacer si recibo un 500 Internal Server Error en mi API?", "acceptedAnswer": {"@type": "Answer", "text": "Un 500 indica un fallo inesperado en el servidor. Primero revisa los registros para identificar la excepción o el error de configuración. Asegúrate de que las dependencias estén disponibles, valida la lógica del código y verifica los límites de recursos. Después de corregir el problema, vuelve a probar la API y considera implementar manejo de errores más específico para evitar futuros 500."}}]}]}</script>
