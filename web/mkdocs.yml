site_name: Somos El Encuadre
site_url: https://elencuadre.pages.dev/
site_description: Análisis técnico de cómo los medios construyen tu realidad.

theme:
  name: material
  language: es
  logo: assets/images/logo.jpg
  favicon: assets/images/logo.jpg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss

nav:
  - Inicio: index.md
  - Análisis:
    - Índice: analisis/index.md
    - "El escudo de Puente": analisis/2026-10-31-largo.md
    - "Dossier del día": analisis/2026-10-31-dossier-v2.md
  - Podcast: podcast/index.md
  - Glosario: glosario.md

  - Contacto: contacto.md
  - Próximamente: proximamente.md

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar_actions.js
  - javascripts/holo.js
  - javascripts/analisis.js
  - javascripts/glosario.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es
  - minify:
      minify_html: true
  - social:
      cards: true
      cards_color:
        fill: '#0a0a0f'
        text: '#e63946'
  - rss:
      enabled: true

use_directory_urls: true
